services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: xiyuguopu-server
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      MYSQL_HOST: ${MYSQL_HOST:-host.docker.internal}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-xiyuguopu}
      MYSQL_USERNAME: ${MYSQL_USERNAME:-xiyuguopu}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      XIYU_JWT_SECRET: ${XIYU_JWT_SECRET}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://47.109.93.162,http://47.109.93.162:8088}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - xiyuguopu

  nginx:
    image: nginx:1.26-alpine
    container_name: xiyuguopu-nginx
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "${NGINX_PORT:-8088}:80"
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - xiyuguopu

networks:
  xiyuguopu:
    driver: bridge
