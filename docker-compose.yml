services:
  db:
    image: mariadb:10.11
    container_name: xiyuguopu-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MYSQL_DATABASE:-xiyuguopu}
      MARIADB_USER: ${MYSQL_USERNAME:-xiyuguopu}
      MARIADB_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    volumes:
      - db-data:/var/lib/mysql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - xiyuguopu

  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: xiyuguopu-server
    restart: unless-stopped
    depends_on:
      - db
    environment:
      SPRING_PROFILES_ACTIVE: prod
      MYSQL_HOST: db
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-xiyuguopu}
      MYSQL_USERNAME: ${MYSQL_USERNAME:-xiyuguopu}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      XIYU_JWT_SECRET: ${XIYU_JWT_SECRET}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://47.109.93.162}
      APP_UPLOAD_IMAGE_DIR: /data/xiyuguopu/uploads/images
    volumes:
      - ${UPLOAD_IMAGE_DIR:-/opt/xiyuguopu-data/uploads/images}:/data/xiyuguopu/uploads/images
    networks:
      - xiyuguopu

  nginx:
    image: nginx:1.26-alpine
    container_name: xiyuguopu-nginx
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ${UPLOAD_IMAGE_DIR:-/opt/xiyuguopu-data/uploads/images}:/data/xiyuguopu/uploads/images:ro
    networks:
      - xiyuguopu

networks:
  xiyuguopu:
    driver: bridge

volumes:
  db-data:
