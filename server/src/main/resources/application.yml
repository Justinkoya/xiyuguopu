# ================================================================
# 西域果铺 — 应用配置
# ================================================================
spring:
  profiles:
    active: dev
  application:
    name: xiyuguopu-server
  servlet:
    multipart:
      max-file-size: ${UPLOAD_IMAGE_MAX_SIZE:5MB}
      max-request-size: ${UPLOAD_IMAGE_MAX_SIZE:5MB}

# MyBatis-Plus
mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.xiyuguopu.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# Knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn

springdoc:
  swagger-ui:
    path: /doc.html
  api-docs:
    path: /v3/api-docs

app:
  cors:
    allowed-origins: "*"
  upload:
    image-dir: ${APP_UPLOAD_IMAGE_DIR:/data/xiyuguopu/uploads/images}
    max-image-size: ${APP_UPLOAD_MAX_IMAGE_SIZE:5242880}
    max-image-side: ${APP_UPLOAD_MAX_IMAGE_SIDE:1200}
    image-quality: ${APP_UPLOAD_IMAGE_QUALITY:0.82}
